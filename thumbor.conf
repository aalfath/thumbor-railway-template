# Thumbor configuration for Railway. Thumbor executes this file as Python, so
# every setting below reads an environment variable with a safe default.
# Upstream reference: https://thumbor.readthedocs.io/en/latest/configuration.html
import os as _os


def _env(name, default):
    value = _os.environ.get(name, "").strip()
    return value if value else default


def _bool(name, default):
    return _env(name, "true" if default else "false").lower() in ("1", "true", "yes", "on")


def _num(name, default, cast=int):
    return cast(_env(name, str(default)))


_DATA = _env("THUMBOR_DATA_DIR", "/data")

# --- Security: signed URLs only -------------------------------------------
SECURITY_KEY = _os.environ["THUMBOR_SECURITY_KEY"]
ALLOW_UNSAFE_URL = _bool("THUMBOR_ALLOW_UNSAFE_URL", False)
# Optional allow-list of source hostnames (comma separated). Empty = any host,
# which is safe because every request must be signed with SECURITY_KEY.
ALLOWED_SOURCES = [s.strip() for s in _env("THUMBOR_ALLOWED_SOURCES", "").split(",") if s.strip()]

# --- Loader -----------------------------------------------------------------
LOADER = "thumbor.loaders.http_loader"
HTTP_LOADER_VALIDATE_CERTS = True
HTTP_LOADER_CONNECT_TIMEOUT = 5
HTTP_LOADER_REQUEST_TIMEOUT = 20
# Few parallel source downloads, so a burst of large originals cannot pile up in RAM.
HTTP_LOADER_MAX_CLIENTS = _num("THUMBOR_HTTP_MAX_CLIENTS", 2)

# --- Storage: originals and rendered results on the Railway volume ---------
STORAGE = "thumbor.storages.file_storage"
FILE_STORAGE_ROOT_PATH = _DATA + "/storage"
STORAGE_EXPIRATION_SECONDS = _num("THUMBOR_STORAGE_EXPIRATION_SECONDS", 30 * 24 * 3600)
RESULT_STORAGE = "thumbor.result_storages.file_storage"
RESULT_STORAGE_FILE_STORAGE_ROOT_PATH = _DATA + "/result_storage"
RESULT_STORAGE_EXPIRATION_SECONDS = _num("THUMBOR_RESULT_STORAGE_EXPIRATION_SECONDS", 7 * 24 * 3600)
RESULT_STORAGE_STORES_UNSAFE = False

# --- Imaging ----------------------------------------------------------------
ENGINE = "thumbor.engines.pil"
QUALITY = _num("THUMBOR_QUALITY", 80)
AUTO_WEBP = _bool("THUMBOR_AUTO_WEBP", True)
RESPECT_ORIENTATION = True
# 0.5 GB RAM fits one or two 30-megapixel sources at a time; raise with more RAM.
MAX_PIXELS = _num("THUMBOR_MAX_PIXELS", 30e6, float)
MAX_WIDTH = _num("THUMBOR_MAX_WIDTH", 0)
MAX_HEIGHT = _num("THUMBOR_MAX_HEIGHT", 0)
MAX_AGE = _num("THUMBOR_MAX_AGE", 24 * 3600)
# Transformations run one at a time in a worker thread (raise with more RAM/CPU),
# so /healthcheck stays responsive while an image is being processed.
ENGINE_THREADPOOL_SIZE = _num("THUMBOR_ENGINE_THREADS", 1)

# --- Smart cropping: local OpenCV face and feature detection ---------------
DETECTORS = [
    "thumbor.detectors.face_detector",
    "thumbor.detectors.feature_detector",
]

try:
    import cv2 as _cv2

    _cv2.setNumThreads(1)
except Exception:  # pragma: no cover - OpenCV is part of the official image
    pass
